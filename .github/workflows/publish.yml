name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm distribution channel (not the package version)'
        type: choice
        required: false
        default: 'latest'
        options:
          - latest
          - beta
          - next

jobs:
  publish:
    name: Build, Test & Publish to npm Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Publish to npm Registry
        run: npm publish --access public --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ inputs.tag || 'latest' }}
